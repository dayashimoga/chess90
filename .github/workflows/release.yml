name: Multi-Platform Release Automation, Checksums & Cloudflare Deployment

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-package:
    name: Build All Platform Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux Desktop Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev stockfish ffmpeg

      - name: Build Web Bundle
        run: |
          cd apps/chess_app
          flutter build web --release
          cd build/web
          zip -r ../../../ChessMaster-Web.zip .

      - name: Build Linux Desktop Bundle
        run: |
          flutter config --enable-linux-desktop
          cd apps/chess_app
          flutter build linux --release
          tar -czf ../../ChessMaster-Linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Build Android APK & AAB
        run: |
          cd apps/chess_app
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../../ChessMaster.apk

          flutter build appbundle --release
          cp build/app/outputs/bundle/release/app-release.aab ../../ChessMaster.aab

      - name: Generate Checksums & CycloneDX SBOM
        run: |
          # Compute cryptographic SHA-256 Checksums
          sha256sum ChessMaster-Web.zip ChessMaster-Linux-x64.tar.gz ChessMaster.apk ChessMaster.aab | sort -k 2 > SHA256SUMS

          # Generate SBOM
          cat <<EOF > sbom.json
          {
            "bomFormat": "CycloneDX",
            "specVersion": "1.5",
            "serialNumber": "urn:uuid:$(uuidgen || echo '00000000-0000-0000-0000-000000000000')",
            "version": 1,
            "metadata": {
              "component": {
                "name": "chessmaster",
                "version": "${GITHUB_REF#refs/tags/v}",
                "type": "application"
              }
            }
          }
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ChessMaster-Web.zip
            ChessMaster-Linux-x64.tar.gz
            ChessMaster.apk
            ChessMaster.aab
            SHA256SUMS
            sbom.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: chessmaster
          directory: apps/chess_app/build/web
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
