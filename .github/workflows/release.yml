name: Multi-Platform Release Automation, Checksums & Cloudflare Deployment

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Build Windows x64 Release
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Build Windows Release
        run: |
          flutter config --enable-windows-desktop
          cd apps\chess_app
          flutter build windows --release

      - name: Package Windows Artifacts (Portable Exe, Setup, & Zip)
        run: |
          powershell packaging\windows\package_windows.ps1

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            dist/ChessMaster-Windows-x64.zip
            dist/ChessMaster-Portable.exe
            dist/ChessMaster-Setup.exe

  build-and-release:
    name: Build All Platforms & Publish Release
    runs-on: ubuntu-latest
    needs: [build-windows]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux Desktop Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev stockfish ffmpeg

      - name: Download Windows Release Artifact
        uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: .

      - name: Build Web Bundle
        run: |
          cd apps/chess_app
          flutter build web --release
          cd build/web
          zip -r ../../../ChessMaster-Web.zip .

      - name: Build Linux Desktop Bundle
        run: |
          flutter config --enable-linux-desktop
          cd apps/chess_app
          flutter build linux --release
          tar -czf ../../ChessMaster-Linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Build Android APK & AAB
        run: |
          cd apps/chess_app
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../../ChessMaster.apk

          flutter build appbundle --release
          cp build/app/outputs/bundle/release/app-release.aab ../../ChessMaster.aab

      - name: Generate Checksums & CycloneDX SBOM
        run: |
          sha256sum $(ls ChessMaster-Web.zip ChessMaster-Windows-x64.zip ChessMaster-Portable.exe ChessMaster-Setup.exe ChessMaster-Linux-x64.tar.gz ChessMaster.apk ChessMaster.aab 2>/dev/null) | sort -k 2 > SHA256SUMS

          cat <<EOF > sbom.json
          {
            "bomFormat": "CycloneDX",
            "specVersion": "1.5",
            "serialNumber": "urn:uuid:$(uuidgen || echo '00000000-0000-0000-0000-000000000000')",
            "version": 1,
            "metadata": {
              "component": {
                "name": "chessmaster",
                "version": "${GITHUB_REF#refs/tags/v}",
                "type": "application"
              }
            }
          }
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ChessMaster-Web.zip
            ChessMaster-Windows-x64.zip
            ChessMaster-Portable.exe
            ChessMaster-Setup.exe
            ChessMaster-Linux-x64.tar.gz
            ChessMaster.apk
            ChessMaster.aab
            SHA256SUMS
            sbom.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: chessmaster
          directory: apps/chess_app/build/web
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
