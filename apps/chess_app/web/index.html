<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ChessMaster: Production-grade, offline-first cross-platform chess mastery platform with 90-day GM-style curriculum, interactive labs, Stockfish analysis, and deterministic video creation.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ChessMaster">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ChessMaster | 90-Day GM Chess Mastery Platform</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #0b0f19;
      color: #f3f4f6;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
    }
    #loading-indicator {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(34, 197, 94, 0.2);
      border-top-color: #22c55e;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #f9fafb;
    }
    .loading-sub {
      font-size: 0.875rem;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <div id="loading-indicator">
    <div class="spinner"></div>
    <div class="loading-title">CHESSMASTER</div>
    <div class="loading-sub">Initializing offline chess engine & curriculum...</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
